<head>

    <!-- 引入圓潤字體 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-creamy: #F9F7F2;      /* 米白色 */
            --gray-blue: #A8B5BF;      /* 灰藍色 */
            --milk-tea: #D9C5B2;       /* 奶茶色 */
            --dark-brown: #4A3E37;     /* 深咖色 */
            --border-color: #E0DDD5;
            --soft-white: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            background-color: var(--bg-creamy);
            color: var(--dark-brown);
            line-height: 1.6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 181, 191, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 197, 178, 0.1) 0px, transparent 50%);
            min-height: 100vh;
        }

        /* 橫幅標題 */
        .banner {
            width: 100%;
            padding: 50px 20px;
            background: linear-gradient(to right, var(--milk-tea), var(--gray-blue));
            color: white;
            text-align: center;
            letter-spacing: 4px;
        }

        .banner h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .banner p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 橫向捲動導航 */
        .nav-scroll-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-creamy);
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-wrapper {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 20px;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-wrapper::-webkit-scrollbar { display: none; }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            padding: 10px 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item span:first-child { font-weight: 700; font-size: 0.9rem; }
        .nav-item span:last-child { font-size: 0.75rem; color: var(--gray-blue); }

        .nav-item.active {
            background: var(--gray-blue);
            border-color: var(--gray-blue);
        }

        .nav-item.active span { color: white; }
        .nav-item.active span:last-child { opacity: 0.8; }

        /* 備註欄 */
        .daily-remark {
            margin: 20px auto;
            max-width: 800px;
            padding: 15px 25px;
            background: var(--soft-white);
            border-left: 4px solid var(--gray-blue);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .container {
            padding: 0 20px 100px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 行前準備區塊 (僅首頁) */
        .prep-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before { content: '|'; color: var(--milk-tea); font-weight: bold; }

/* VJW 專屬樣式 */
.vjw-section {
    background: white;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid var(--border-color);
    margin-bottom: 30px;
}

.vjw-card {
    background: #F0F4F8; /* 淺藍色背景 */
    padding: 15px;
    border-radius: 10px;
    font-size: 0.85rem;
}

.vjw-btn {
    display: block;
    text-align: center;
    background: var(--dark-brown);
    color: white !important;
    padding: 12px;
    text-decoration: none;
    border-radius: 10px;
    margin: 15px 0;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.vjw-list {
    list-style: none;
    padding: 0;
}

.vjw-list li {
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.vjw-list li::before {
    content: '✓';
    color: #4CAF50;
    font-weight: bold;
}

        /* 行程總覽列表 */
        .index-list { list-style: none; }
        .index-list li {
            padding: 18px;
            background: white;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .index-list span { color: var(--gray-blue); margin-right: 12px; font-weight: 700; }

        /* 時間線：點放大、線加粗 */
        .timeline {
            position: relative;
            padding-left: 35px;
            margin-top: 25px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            bottom: 5px;
            width: 5px; /* 加粗線條 */
            background: var(--milk-tea);
            border-radius: 10px;
        }

        .spot {
            position: relative;
            margin-bottom: 40px;
        }

        .spot::before {
            content: '•';
            position: absolute;
            left: -43px; /* 調整放大圓點位置 */
            top: -14px;
            color: var(--milk-tea);
            font-size: 3rem; /* 放大點點 */
        }

        .time { font-size: 0.9rem; color: var(--gray-blue); font-weight: 700; }
        .spot-name { font-size: 1.2rem; font-weight: 500; margin: 4px 0; }

        .spot-detail {
            font-size: 0.85rem;
            background: white;
            padding: 12px 18px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            color: var(--dark-brown);
            opacity: 0.9;
        }

        /* 交通標籤 */
        .transport-badge {
            float: right;
            font-size: 0.75rem;
            padding: 3px 15px;
            border: 1.5px solid var(--gray-blue);
            color: var(--gray-blue);
            border-radius: 20px;
            font-weight: 500;
        }

        /* 清除浮動 */
        .clearfix::after { content: ""; clear: both; display: table; }
/* --- 這裡開始是新加入的圖片框樣式 --- */
        .photo-upload-zone {
            margin-top: 12px;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px dashed var(--milk-tea);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .photo-upload-zone:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .photo-upload-zone img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--gray-blue);
            font-size: 0.8rem;
        }

        .upload-placeholder::before {
            content: '👁️‍🗨️';
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        /* --- 樣式結束 --- */
/* 右下角懸浮儲存按鈕 */
.save-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    background-color: var(--dark-brown);
    color: white;
    padding: 10px 16px;
    border-radius: 30px;
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s, background-color 0.2s;
}

.save-btn:hover {
    background-color: #5d4e45;
    transform: scale(1.05);
}

.save-btn:active {
    transform: scale(0.95);
}

/* 儲存時隱藏按鈕，避免按鈕把自己也存進去 */
.hidden-print {
    display: none !important;
}
/* 天氣與穿搭建議樣式 */
        .weather-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .weather-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .weather-icon {
            font-size: 3rem;
            background: var(--bg-creamy);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .weather-info {
            flex: 1;
        }
        .temp-range {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark-brown);
            margin-bottom: 5px;
        }
        .outfit-tips {
            font-size: 0.85rem;
            color: var(--dark-brown);
            background: #FFF9F2; /* 極淺橘色背景 */
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 3px solid var(--milk-tea);
margin-top: 15px;
        }
/* 匯率換算器專屬樣式 */
        .exchange-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .converter-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .currency-row {
            display: flex;
            align-items: center;
            background: var(--bg-creamy);
            padding: 12px 15px;
            border-radius: 12px;
        }
        .currency-label {
            font-size: 0.85rem;
            font-weight: 700;
            width: 85px;
            color: var(--dark-brown);
        }
        .currency-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1.2rem;
            color: var(--dark-brown);
            text-align: right;
            outline: none;
            width: 100%;
        }
        .exchange-icon {
            text-align: center;
            color: var(--milk-tea);
            font-size: 1.2rem;
            margin: -5px 0;
        }
        .rate-info {
            font-size: 0.75rem;
            color: var(--gray-blue);
            text-align: center;
            margin-top: 5px;
        }
/* 記帳頁面專屬樣式 */
.accounting-header { background: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; border: 1px solid var(--border-color); }
.total-jpy { font-size: 2rem; color: #b3544d; font-weight: 700; margin: 0; }
.total-twd { font-size: 1rem; color: var(--gray-blue); margin-bottom: 15px; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #eee; padding-top: 15px; }
.cat-node { font-size: 0.85rem; display: flex; justify-content: space-between; }
.btn-add-record { background: #b3544d; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-size: 1rem; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(179,84,77,0.2); }
.acc-date-group { background: white; border-radius: 15px; margin-bottom: 15px; overflow: hidden; border: 1px solid var(--border-color); }
.acc-date-header { background: #F9F7F2; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 700; font-size: 0.9rem; }
.acc-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-top: 1px solid #f5f5f5; }
.acc-info .shop { font-size: 0.95rem; font-weight: 500; }
.acc-info .sub { font-size: 0.75rem; color: #999; }
.acc-right { display: flex; align-items: center; gap: 10px; }
.acc-amount { font-weight: 700; color: var(--dark-brown); }
.acc-del { background: #eee; color: #999; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 12px; }

/* 彈出視窗樣式 */
.acc-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
.acc-modal-content { background: var(--bg-creamy); padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; }
.acc-modal-content label { font-size: 0.8rem; color: #888; display: block; margin-top: 10px; }
.acc-modal-content input, .acc-modal-content select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin-top: 5px; outline: none; }
/* 1. 調整新增分類的容器，讓內容物置中 */
.cat-input-area {
    display: flex;
    justify-content: center; /* 水平置中 */
    align-items: center;     /* 垂直對齊 */
    gap: 10px;               /* 輸入框與按鈕的間距 */
    margin-top: 10px;
}

/* 2. 修改「新增分類」輸入框的長度 */
#acc-new-cat {
    width: 200px !important;  /* 設定輸入框長度 */
    margin-top: 0 !important; /* 移除上方間距以保持水平對齊 */
    padding: 8px 12px !important;
    font-size: 0.85rem !important;
    border-radius: 10px !important;
}

/* 3. 修改「+」按鈕的長度 */
.cat-input-area .plus-btn {
    width: 45px !important;   /* 設定按鈕長度（寬度） */
    height: 36px !important;  /* 設定高度，建議與輸入框一致 */
    padding: 0 !important;    /* 清除內邊距 */
    margin: 0 !important;     /* 清除外邊距 */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem !important;
    border-radius: 10px !important; /* 讓按鈕也圓潤 */
    background-color: var(--milk-tea); /* 使用你網頁的奶茶色，或是 var(--muji-red) */
    color: white;
    border: none;
    cursor: pointer;
}
/* --- 以下是針對「新增視窗」按鈕寬度的微調，直接新增即可 --- */

/* 1. 修改彈出視窗裡「日期選擇格子」的長度 */
#acc-date {
    width: 265px !important;   /* 強制設定長度 */
    margin: 5px auto !important; /* 讓它置中 */
    display: block !important;
}

/* 修正儲存按鈕：居中且不超出頁面 */
.acc-modal-content .save-btn {
    width: 180px !important;    /* 設定你想要的寬度 */
    max-width: 90%;             /* 防止在小手機上超出螢幕 */
    display: block !important;   /* 強制轉為區塊元素 */
    margin: 25px auto !important; /* 左右自動邊距 (居中) */
    padding: 12px 0 !important;   /* 上下內邊距，左右設為0 */
    float: none !important;      /* 確保沒有向右浮動 */
    position: static !important; /* 確保不是絕對定位 */
    box-sizing: border-box;      /* 確保寬度包含邊框和內邊距 */
}
/* 彈出視窗左上角的 X 按鈕 */
.acc-modal-close-left {
    position: absolute;
    top: 15px;
    left: 15px; /* 定位於左上角 */
    background: #eee;
    color: #888;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%; /* 圓潤風 */
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.3s, color 0.3s;
    z-index: 10;
}

.acc-modal-close-left:hover {
    background: #ddd;
    color: var(--dark-brown);
}

/* 確保彈出視窗內容容器有定位參考基準 */
.acc-modal-content {
    position: relative; /* 必加：讓左上角按鈕能相對於此框定位 */
}

			} else {
                    // 每日詳細行程內容
                    page.innerHTML = `
                        <div class="clearfix">
                            <div class="transport-badge">${day.transport}</div>
                        </div>
                        <div class="timeline">
                            ${day.schedule.map((s, sIdx) => {
    // 檢查是否有網址，並確保不是 undefined 或空字串
    const hasImg = s.imgUrl && s.imgUrl.trim() !== "";
    
    return `
    <div class="spot">
        <div class="time">${s.time}</div>
        <div class="spot-name">${s.spot}</div>
        ${s.detail ? `<div class="spot-detail">${s.detail}</div>` : ''}
        
        <div class="photo-upload-zone" onclick="document.getElementById('file-${index}-${sIdx}').click()" 
             style="background-color: #f5f5f5; border: 1px dashed #ccc; min-height: 150px; cursor: pointer; position: relative; border-radius: 8px; overflow: hidden; margin-top: 10px;">
            
            <!-- 提示文字：只有在沒有網址時才顯示 -->
            <div id="hint-${index}-${sIdx}" 
                 style="display: ${hasImg ? 'none' : 'flex'}; align-items: center; justify-content: center; height: 150px; color: #888;">
                <span>📷 點擊更換照片</span>
            </div>
            
            <!-- 圖片標籤：如果有網址就直接顯示 -->
            <img id="img-${index}-${sIdx}" 
     src="${s.imgUrl ? s.imgUrl : ''}" 
     style="display: ${s.imgUrl ? 'block' : 'none'}; width: 100%; height: auto; min-height: 150px;" 
     alt="照片"
     onerror="this.style.display='none'; document.getElementById('hint-${index}-${sIdx}').style.display='flex';">
                 
            <input type="file" id="file-${index}-${sIdx}" accept="image/*" style="display:none" 
                   onchange="handleImageUpload(this, '${index}-${sIdx}')">
        </div>
    </div>
    `;
}).join('')}
                        </div>
                    `;
                }
                mainContainer.appendChild(page);
            });
        }

        function showPage(index) {
            // 切換頁面顯示
            const pages = document.querySelectorAll('.page');
            pages.forEach((p, i) => {
                p.classList.toggle('active', i === index);
            });

            // 切換導航鈕樣式
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            // 更新備註
            document.getElementById('dailyRemark').innerText = tripData.days[index].remark;

            // 導航列捲動置中
            const wrapper = document.getElementById('navWrapper');
            const activeItem = navItems[index];
            const scrollTarget = activeItem.offsetLeft - (wrapper.offsetWidth / 2) + (activeItem.offsetWidth / 2);
            wrapper.scrollTo({ left: scrollTarget, behavior: 'smooth' });

            // 視窗捲動到頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function handleImageUpload(input, id) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgElement = document.getElementById(`img-${id}`);
                    const hintElement = document.getElementById(`hint-${id}`);
                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                    hintElement.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }
        function exportHTML() {
            const btn = document.getElementById('exportBtn');
            btn.classList.add('hidden-print');

            const fullHTML = `<!DOCTYPE html>\n<html lang="zh-TW">\n${document.documentElement.innerHTML}\n</html>`;

            const blob = new Blob([fullHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '福岡行程_已儲存照片.html';
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                btn.classList.remove('hidden-print');
            }, 100);
        }
// 匯率換算邏輯函數
        let currentRate = 4.65; // 預設匯率
        async function setupExchangeRate() {
            const twdInput = document.getElementById('twdInput');
            const jpyInput = document.getElementById('jpyInput');
            const rateDetail = document.getElementById('rateDetail');

            if (!twdInput || !jpyInput) return;

            // 抓取即時資料
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await response.json();
                if (data && data.rates && data.rates.JPY) {
                    currentRate = data.rates.JPY;
                    rateDetail.innerText = `今日即時匯率：1 TWD = ${currentRate.toFixed(2)} JPY`;
                }
            } catch (error) {
                rateDetail.innerText = `使用預設匯率：1 TWD = ${currentRate} JPY`;
            }

            // 監聽台幣輸入
            twdInput.addEventListener('input', () => {
                if (!twdInput.value) { jpyInput.value = ""; return; }
                jpyInput.value = Math.floor(parseFloat(twdInput.value) * currentRate);
            });

            // 監聽日幣輸入
            jpyInput.addEventListener('input', () => {
                if (!jpyInput.value) { twdInput.value = ""; return; }
                twdInput.value = (parseFloat(jpyInput.value) / currentRate).toFixed(2);
            });
        }
        window.onload = initApp;
let accRecords = JSON.parse(localStorage.getItem('acc_records')) || [];
let accCats = JSON.parse(localStorage.getItem('acc_cats')) || ["服飾", "藥妝", "餐飲", "伴手禮"];
let accClosedDates = new Set();

function openAccModal() {
    document.getElementById('accModal').style.display = 'flex';
    document.getElementById('acc-date').value = new Date().toISOString().split('T')[0];
    renderAccCatOptions();
}

function closeAccModal() { document.getElementById('accModal').style.display = 'none'; }

function renderAccCatOptions() {
    const s = document.getElementById('acc-cat-select');
    s.innerHTML = accCats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function addAccCategory() {
    const val = document.getElementById('acc-new-cat').value.trim();
    if (val && !accCats.includes(val)) {
        accCats.push(val);
        localStorage.setItem('acc_cats', JSON.stringify(accCats));
        renderAccCatOptions();
        document.getElementById('acc-cat-select').value = val;
        document.getElementById('acc-new-cat').value = '';
    }
}

function saveAccRecord() {
    const record = {
        id: Date.now(),
        date: document.getElementById('acc-date').value,
        cat: document.getElementById('acc-cat-select').value,
        shop: document.getElementById('acc-shop').value || "未指定商店",
        amount: parseFloat(document.getElementById('acc-amount-in').value) || 0,
        pay: document.getElementById('acc-pay-method').value
    };
    if (record.amount <= 0) return alert("請輸入金額");
    accRecords.push(record);
    localStorage.setItem('acc_records', JSON.stringify(accRecords));
    closeAccModal();
    updateAccUI();
}

function deleteAccRecord(id) {
    if(confirm('確定刪除嗎？')) {
        accRecords = accRecords.filter(r => r.id !== id);
        localStorage.setItem('acc_records', JSON.stringify(accRecords));
        updateAccUI();
    }
}

function updateAccUI() {
    const totalJPY = accRecords.reduce((sum, r) => sum + r.amount, 0);
    const totalTWD = Math.round(totalJPY * (typeof currentRate !== 'undefined' ? 1/currentRate : 0.21)); 
    // 這裡用了你原本網頁的 currentRate 變數

    if(document.getElementById('acc-total-jpy')) {
        document.getElementById('acc-total-jpy').innerText = `¥ ${totalJPY.toLocaleString()}`;
        document.getElementById('acc-total-twd').innerText = `約 NT$ ${totalTWD.toLocaleString()}`;
        
        // 分類統計
        const catMap = {};
        accRecords.forEach(r => catMap[r.cat] = (catMap[r.cat] || 0) + r.amount);
        document.getElementById('acc-category-grid').innerHTML = Object.keys(catMap).map(k => `
            <div class="cat-node"><span>${k}</span><span>¥${catMap[k].toLocaleString()}</span></div>
        `).join('');

        // 列表渲染 (含收納邏輯)
        const list = document.getElementById('acc-list');
        const grouped = accRecords.reduce((acc, r) => { (acc[r.date] = acc[r.date] || []).push(r); return acc; }, {});
        const sortedDates = Object.keys(grouped).sort((a,b) => new Date(b) - new Date(a));

        list.innerHTML = sortedDates.map(date => {
            const isClosed = accClosedDates.has(date);
            const daySum = grouped[date].reduce((s, r) => s + r.amount, 0);
            return `
                <div class="acc-date-group">
                    <div class="acc-date-header" onclick="toggleAccDate('${date}')">
                        <span>${date} (¥${daySum.toLocaleString()})</span>
                        <span>${isClosed ? '◀' : '▼'}</span>
                    </div>
                    <div style="display: ${isClosed ? 'none' : 'block'}">
                        ${grouped[date].map(r => `
                            <div class="acc-item">
                                <div class="acc-info">
                                    <div class="shop">${r.shop}</div>
                                    <div class="sub">${r.cat} · ${r.pay}</div>
                                </div>
                                <div class="acc-right">
                                    <div class="acc-amount">¥${r.amount.toLocaleString()}</div>
                                    <button class="acc-del" onclick="deleteAccRecord(${r.id})">×</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }
}

function toggleAccDate(date) {
    accClosedDates.has(date) ? accClosedDates.delete(date) : accClosedDates.add(date);
    updateAccUI();
}
    </script>
<!-- 記帳彈出視窗 -->

    <div class="acc-modal-content">

        <button class="acc-modal-close-left" onclick="closeAccModal()">✕</button>
